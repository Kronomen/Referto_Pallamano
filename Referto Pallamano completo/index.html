<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Referto Pallamano</title>

</head>

<body>

    <script>

        function apriReferto(){

            const finestra =
                window.open(
                    "Referto%20Pallamano.html",
                    "_blank",
                    "width=1600,height=1000,resizable=yes,scrollbars=yes"
                );

            if(!finestra){

                alert(
                    "Il browser ha bloccato l'apertura del Referto. " +
                    "Consenti i popup per questo sito."
                );

                return;
            }

            finestra.focus();

        }

    </script>


    <div style="
        width:100%;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:Arial,sans-serif;
        background:#f1f5f9;
    ">

        <button
            onclick="apriReferto()"
            style="
                background:#1e40af;
                color:white;
                border:none;
                padding:18px 35px;
                border-radius:12px;
                font-size:20px;
                font-weight:bold;
                cursor:pointer;
                box-shadow:0 4px 12px rgba(0,0,0,.2);
            "
        >
            APRI REFERTO PALLAMANO
        </button>

    </div>

</body>

</html>
