<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Referto Pallamano</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:#061a34;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
}
/* Sfondo completo ma NON tagliato: l'immagine viene rimpicciolita
   per entrare nello schermo del tablet da 10". */
.background{
  position:fixed;
  inset:0;
  z-index:0;
  background-image:url("referto-pallamano-home-clean.png");
  background-position:center center;
  background-repeat:no-repeat;
  background-size:contain;
  background-color:#061a34;
}
/* Leggerissimo velo solo nella parte bassa per leggere il pulsante. */
.bottom-shade{
  position:fixed;
  left:0;right:0;bottom:0;
  height:24%;
  z-index:1;
  pointer-events:none;
  background:linear-gradient(to top,rgba(0,8,22,.70),rgba(0,8,22,.10),transparent);
}
.content{
  position:relative;
  z-index:2;
  width:100%;
  height:100dvh;
}
.open-button{
  position:absolute;
  left:50%;
  bottom:max(34px,6.5vh);
  transform:translateX(-50%);
  width:min(380px,72vw);
  height:clamp(48px,6.5vh,60px);
  border:0;
  border-radius:10px;
  background:#1557a6;
  color:#fff;
  font-size:clamp(15px,1.8vw,21px);
  font-weight:900;
  letter-spacing:.4px;
  box-shadow:0 6px 18px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.18);
  cursor:pointer;
  touch-action:manipulation;
}
.open-button:active{
  transform:translateX(-50%) scale(.985);
  background:#0d468b;
}
.close-button{
  position:absolute;
  top:max(8px,env(safe-area-inset-top));
  right:max(8px,env(safe-area-inset-right));
  z-index:3;
  height:24px;
  padding:0 8px;
  border:1px solid rgba(120,20,20,.9);
  border-radius:5px;
  background:rgba(239,68,68,.92);
  color:#111;
  font-size:9px;
  font-weight:900;
  cursor:pointer;
}
.version{
  position:absolute;
  right:max(10px,env(safe-area-inset-right));
  bottom:max(7px,env(safe-area-inset-bottom));
  z-index:3;
  color:rgba(255,255,255,.72);
  font-size:8px;
  text-shadow:0 2px 6px rgba(0,0,0,.9);
}
@media (orientation:portrait){
  .background{background-size:contain}
  .open-button{
    width:min(360px,78vw);
    bottom:max(42px,6vh);
    height:52px;
    font-size:17px;
  }
}
</style>
</head>
<body>
<div class="background" aria-hidden="true"></div>
<div class="bottom-shade" aria-hidden="true"></div>

<div class="content">
  <button class="open-button" type="button" onclick="apriGara()">🏐&nbsp; APRI GESTIONE GARA</button>
  <button class="close-button" type="button" onclick="chiudi()">CHIUDI</button>
  <div class="version">Kronoman V. 2.01 08/26</div>
</div>

<script>
function entraSchermoIntero(){
  const root=document.documentElement;
  if(!document.fullscreenElement && root.requestFullscreen){
    return root.requestFullscreen().catch(()=>{});
  }
  return Promise.resolve();
}

function apriGara(){
  // Passaggio diretto al referto: nessuna transizione, nessun fullscreen
  // e nessun ricaricamento della schermata INDEX.
  window.location.replace("Referto_Pallamano_Tablet.html");
}
function chiudi(){
  window.close();
  setTimeout(function(){
    if(!window.closed) window.location.href="about:blank";
  },300);
}
</script>
</body>
</html>
