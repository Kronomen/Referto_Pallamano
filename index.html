<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Referto Pallamano</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061a34;font-family:Arial,Helvetica,sans-serif}
body{position:relative;display:flex;align-items:center;justify-content:center;min-height:100dvh}
.background{position:fixed;inset:0;z-index:0;background:url("referto-pallamano-home-clean.png") center/contain no-repeat #061a34}
.bottom-shade{position:fixed;left:0;right:0;bottom:0;height:24%;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,8,22,.70),rgba(0,8,22,.10),transparent)}
.content{position:relative;z-index:2;width:100%;height:100dvh}
.open-button{position:absolute;left:50%;bottom:max(34px,6.5vh);transform:translateX(-50%);display:flex;align-items:center;justify-content:center;width:min(380px,72vw);height:clamp(48px,6.5vh,60px);border:0;border-radius:10px;background:#1557a6;color:#fff;font-size:clamp(15px,1.8vw,21px);font-weight:900;letter-spacing:.4px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.18);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.open-button:active{transform:translateX(-50%) scale(.985);background:#0d468b}
.close-button{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:3;height:24px;padding:0 8px;border:1px solid rgba(120,20,20,.9);border-radius:5px;background:rgba(239,68,68,.92);color:#111;font-size:9px;font-weight:900;text-decoration:none;display:flex;align-items:center;touch-action:manipulation}
.version{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));z-index:3;color:rgba(255,255,255,.72);font-size:8px;text-shadow:0 2px 6px rgba(0,0,0,.9)}
@media(orientation:portrait){.open-button{width:min(360px,78vw);bottom:max(42px,6vh);height:52px;font-size:17px}}
</style>
</head>
<body>
<div class="background" aria-hidden="true"></div>
<div class="bottom-shade" aria-hidden="true"></div>
<div class="content">
<a class="open-button" href="Referto_Pallamano.html">🏐&nbsp; APRI GESTIONE GARA</a>
<a class="close-button" href="about:blank">CHIUDI</a>
<div class="version">Kronoman V. 2.01 08/26</div>
</div>
<noscript><div style="position:fixed;left:10px;right:10px;bottom:10px;z-index:10;background:#fff;color:#111;padding:10px;border-radius:8px;text-align:center;font:700 13px Arial">JavaScript non è necessario per aprire la gestione gara: usa il pulsante sopra.</div></noscript>
</body>
</html>
